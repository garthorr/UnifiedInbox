services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unified_inbox
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d unified_inbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: dev
    command: sh -c "npx prisma db push --skip-generate && npx prisma db seed; npm run dev"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:devpassword@db:5432/unified_inbox

  worker:
    build:
      context: .
      target: dev
    command: npm run worker
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:devpassword@db:5432/unified_inbox


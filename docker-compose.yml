services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unified_inbox
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d unified_inbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: production
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/unified_inbox
    networks:
      - internal
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.unified-inbox.rule=Host(`inbox.home.tastymath.com`)"
      - "traefik.http.routers.unified-inbox.entrypoints=websecure"
      - "traefik.http.routers.unified-inbox.tls=true"
      - "traefik.http.routers.unified-inbox.tls.certresolver=le"
      - "traefik.http.services.unified-inbox.loadbalancer.server.port=3000"

  worker:
    build:
      context: .
      target: worker-production
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/unified_inbox
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
  traefik:
    external: true
    name: traefik

services:
  db:
    # Minor-version pin: patch releases still flow; bump minors deliberately.
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: unified_inbox
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d unified_inbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: production
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/unified_inbox
    networks:
      - internal
      - traefik
    restart: unless-stopped
    mem_limit: 1g
    # Lets the container reach services on the Docker host (e.g. a local Ollama
    # at http://host.docker.internal:11434). On Linux this mapping is required —
    # host.docker.internal does not resolve inside containers without it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.unified-inbox.rule=Host(`inbox.home.tastymath.com`)"
      - "traefik.http.routers.unified-inbox.entrypoints=websecure"
      - "traefik.http.routers.unified-inbox.tls=true"
      - "traefik.http.routers.unified-inbox.tls.certresolver=letsencrypt"
      - "traefik.http.services.unified-inbox.loadbalancer.server.port=3000"

  worker:
    build:
      context: .
      target: worker-production
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/unified_inbox
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  internal:
  traefik:
    external: true
    name: traefik
